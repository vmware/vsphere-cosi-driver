kind: Namespace
apiVersion: v1
metadata:
  name: vmware-system-cosi
---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: vsphere-cosi-controller
  namespace: vmware-system-cosi
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: vsphere-cosi-controller-role
rules:
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["buckets", "bucketaccesses"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["buckets/status", "bucketaccesses/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["buckets/finalizers", "bucketaccesses/finalizers"]
    verbs: ["update"]
  # The sidecar writes BucketAccess Secrets in workload namespaces.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: vsphere-cosi-controller-binding
subjects:
  - kind: ServiceAccount
    name: vsphere-cosi-controller
    namespace: vmware-system-cosi
roleRef:
  kind: ClusterRole
  name: vsphere-cosi-controller-role
  apiGroup: rbac.authorization.k8s.io
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: vsphere-cosi-controller
  namespace: vmware-system-cosi
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: vsphere-cosi-controller
  template:
    metadata:
      labels:
        app: vsphere-cosi-controller
        role: vsphere-cosi
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "app"
                    operator: In
                    values:
                      - vsphere-cosi-controller
              topologyKey: "kubernetes.io/hostname"
      serviceAccount: vsphere-cosi-controller
      nodeSelector:
        node-role.kubernetes.io/control-plane: ''
      tolerations:
        - operator: "Exists"
          key: "node-role.kubernetes.io/control-plane"
          effect: "NoSchedule"
      hostNetwork: true
      priorityClassName: system-node-critical
      containers:
        - name: objectstorage-provisioner-sidecar
          image: localhost:5000/vmware/cosi-provisioner-sidecar:<cosi_sidecar_ver>
          args:
            - "--leader-elect"
          env:
            - name: COSI_ENDPOINT
              value: "unix:///var/lib/cosi/cosi.sock"
            - name: KUBERNETES_SERVICE_HOST
              value: "127.0.0.1"
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
          imagePullPolicy: "IfNotPresent"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65533
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: socket-dir
        - name: vsphere-cosi-controller
          image: localhost:5000/vmware/vsphere-cosi:<vsphere_cosi_ver>
          env:
            - name: COSI_ENDPOINT
              value: "unix:///var/lib/cosi/cosi.sock"
            - name: GOMEMLIMIT
              value: "4500MiB"
          imagePullPolicy: "IfNotPresent"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65533
          resources:
            requests:
              memory: 100Mi
            limits:
              memory: 5Gi
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: socket-dir
      volumes:
        - name: socket-dir
          emptyDir: {}
