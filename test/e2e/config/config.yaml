# Config for the E2E tests. Defaults to the Supervisor layout on the local kind testbed (make local-dev).
# Refer to README.md for available options and overrides.
cluster:
  kubeconfig: ~/.kube/config
  context: kind-cosi-cluster
driver:
  name: cosi.vsphere.vmware.com
  namespace: vmware-system-cosi
  deployment: vsphere-cosi-controller
controller:
  namespace: kube-system
  deployment: cosi-controller
