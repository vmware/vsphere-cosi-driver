# Config for Supervisor(WCP) kubernetes cluster.
# Names follow the Supervisor design doc and are not yet verified against a real Supervisor.
cluster:
  kubeconfig: ~/.kube/config
  context: CHANGE-ME
driver:
  name: cosi.vsphere.vmware.com
  namespace: vmware-system-cosi
  deployment: vsphere-cosi-driver
controller:
  namespace: kube-system
  deployment: cosi-controller
# Names of the operator's namespace and Deployment are not yet verified against a real Supervisor.
operator:
  namespace: CHANGE-ME
  deployment: object-store-operator
# Scenarios that need a stand-in skip unless it is fake, and real mode has no scenarios yet.
standins:
  s3_backend: real
  iam: real
  objectstore: real
  admin_secret: real
