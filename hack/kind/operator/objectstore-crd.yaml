# Fixture for the ObjectStore CRD that the vSAN team ships. Kind has none, and the operator needs
# the kind to exist. The schema keeps every field and there is no status subresource, so a test
# can create an object together with its status.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: objectstores.objectstore.vsan.broadcom.com
spec:
  group: objectstore.vsan.broadcom.com
  scope: Namespaced
  names:
    kind: ObjectStore
    listKind: ObjectStoreList
    plural: objectstores
    singular: objectstore
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
